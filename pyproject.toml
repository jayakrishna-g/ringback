[project]
name = "ringback"
version = "0.1.0"
description = "A coding agent on a Runta runtime that keeps working in the background and phones you when it needs you."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
deploy = ["runta-sdk>=0.2.6"]
dev = ["pytest>=8", "ruff>=0.8", "runta-sdk>=0.2.6"]

[project.scripts]
ringback = "ringback.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ringback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fastapi's TestClient warns about its own httpx dependency; nothing to act on here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]
